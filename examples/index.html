<style>
    :root {
        --primary-color: #4f46e5;
        --primary-hover: #4338ca;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --radius: 12px;
    }

    * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
    }

	body { 
        margin: 0; 
        padding: 0; 
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
    }

    header {
        background: var(--card-bg);
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    .logo {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--primary-color);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1.5rem;
    }

    /* 上传区域美化 */
    .upload-section {
        background: var(--card-bg);
        border: 2px dashed var(--border-color);
        border-radius: var(--radius);
        padding: 1.25rem 1.5rem;
        text-align: center;
        transition: all 0.2s ease;
        cursor: pointer;
        position: relative;
        overflow: hidden;
    }

    .upload-section:hover, .upload-section.dragover {
        border-color: var(--primary-color);
        background: #f5f3ff;
    }

    .upload-icon {
        width: 32px;
        height: 32px;
        margin: 0 auto 0.5rem;
        color: var(--text-muted);
    }

    .upload-section h2 {
        margin: 0 0 0.25rem;
        font-size: 1rem;
        font-weight: 600;
    }

    .upload-section p {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    #uploadFileInput {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
    }

    /* 进度条美化 */
    .progress-container {
        display: none;
        margin-top: 1.5rem;
        background: #e2e8f0;
        border-radius: 999px;
        height: 8px;
        overflow: hidden;
    }

    .progress-bar {
        height: 100%;
        background: var(--primary-color);
        width: 0%;
        transition: width 0.3s ease;
    }

    /* 结果区域 */
    #result {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
        align-items: center;
    }

    .slide {
        background: white;
        overflow: hidden;
        transition: transform 0.2s ease;
    }

    /* 缩放层：固定为缩放后的尺寸，内部 slide 通过 transform 缩放 */
    .slide-scaler {
        position: relative;
        overflow: hidden;
        margin: 0 auto 2rem;
        background: #fff;
        box-shadow: var(--shadow);
        border-radius: 4px;
    }

    .slide-scaler > section.slide {
        margin: 0;
        transform-origin: top left;
    }

    /* 工具栏 */
    .toolbar {
        display: none;
        gap: 12px;
        margin-bottom: 1.5rem;
        justify-content: flex-end;
    }

    .btn {
        background: var(--primary-color);
        color: white;
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background 0.2s;
    }

    .btn:hover {
        background: var(--primary-hover);
    }

    .btn-secondary {
        background: #fff;
        color: var(--text-main);
        border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
        background: #f1f5f9;
    }

    .loading-text {
        text-align: center;
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: var(--text-muted);
    }

    /* 响应式调整 */
    @media (max-width: 768px) {
        .container { margin: 1rem auto; }
        .upload-section { padding: 2rem 1rem; }
    }

    /* ===== 播放演示（动画 / 切换 / 自动播放）===== */
    #player {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }
    #player .pptx-holder {
        position: relative;
        box-shadow: 0 0 60px rgba(0,0,0,0.6);
    }
    #player .pptx-holder.fade-in { animation: pptxSlideIn 0.4s ease; }
    #player .pptx-holder.fade-out { animation: pptxSlideOut 0.4s ease forwards; }
    @keyframes pptxSlideIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pptxSlideOut { to { opacity: 0; } }

    .pptx-anim {
        animation-duration: var(--dur, 1s);
        animation-fill-mode: both;
        animation-timing-function: ease;
    }
    @keyframes pptxFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pptxFlyIn { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pptxZoom { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
    @keyframes pptxWipe { from { opacity: 0; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
    .pptx-fade { animation-name: pptxFade; }
    .pptx-flyIn { animation-name: pptxFlyIn; }
    .pptx-zoom { animation-name: pptxZoom; }
    .pptx-wipe { animation-name: pptxWipe; }

    #player-bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        background: rgba(15,23,42,0.7);
        color: #fff;
        z-index: 10000;
        opacity: 0.15;
        transition: opacity 0.2s;
    }
    #player-bar:hover { opacity: 1; }
    #player-bar .pp-btn {
        background: rgba(255,255,255,0.12);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 0.85rem;
    }
    #player-bar .pp-btn:hover { background: rgba(255,255,255,0.25); }
    #player-bar .pp-page { margin-left: auto; font-size: 0.85rem; }
</style>
</head>

    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M2 15h10"></path><path d="m9 18 3-3-3-3"></path></svg>
            PPTX Parser
        </div>
        <div class="actions">

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                GitHub
            </a>
        </div>
    </header>

	<div class="container">
        <div class="upload-section" id="dropZone">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </div>
            <h2>点击上传 PPTX 文件</h2>
            <p>或者将文件拖拽到此处，支持 .pptx 格式</p>
            <input id="uploadFileInput" type="file" accept=".pptx" />
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="loading-text" id="loadingText">正在准备解析...</div>
        </div>

        <div class="toolbar" id="toolbar">
            <button id="zoom-out" class="btn btn-secondary" title="缩小">−</button>
            <button id="zoom-label" class="btn btn-secondary" title="点击适应宽度">100%</button>
            <button id="zoom-in" class="btn btn-secondary" title="放大">+</button>
            <button id="play-btn" class="btn" title="播放演示（动画/切换/自动播放）">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"></path></svg>
                播放演示
            </button>
            <button id="fullscreen-btn" class="btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                全屏演示
            </button>
        </div>

        <div id="result"></div>
	</div>
<script type="module">
// 引入 PPTX 解析核心模块
import pptxToHtml from '../dist/ppt-parser.browser.js';

// 获取 DOM 元素引用
const resultDiv = document.getElementById("result");
const uploadFileInput = document.getElementById("uploadFileInput");
const dropZone = document.getElementById("dropZone");
const progressContainer = document.getElementById("progressContainer");
const progressBar = document.getElementById("progressBar");
const loadingText = document.getElementById("loadingText");
const toolbar = document.getElementById("toolbar");

// 预览缩放状态
let currentScale = 1;
let currentSlideSize = null;

// 处理拖拽视觉效果
['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    }, false);
});

['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (eventName === 'drop') {
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }
    }, false);
});

// 全屏功能实现
let oldWidth, oldMargin, isFullscreenMode = false;
const fullscreenBtn = document.getElementById("fullscreen-btn");

fullscreenBtn.addEventListener("click", function() {
    if (!isFullscreenMode) {
        // 进入全屏模式
        const slides = document.querySelectorAll("#result .slide");
        if (slides.length > 0) {
            oldWidth = slides[0].style.width;
            oldMargin = slides[0].style.margin;
            slides.forEach(s => {
                s.style.width = "99%";
                s.style.margin = "0 auto";
            });
        }
        
        const docElm = document.documentElement;
        if (docElm.requestFullscreen) docElm.requestFullscreen();
        else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
        else if (docElm.msRequestFullscreen) docElm.msRequestFullscreen();
        else if (docElm.mozRequestFullScreen) docElm.mozRequestFullScreen();
        
        isFullscreenMode = true;
        fullscreenBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg> 退出全屏';
    } else {
        // 退出全屏模式
        const slides = document.querySelectorAll("#result .slide");
        slides.forEach(s => {
            s.style.width = oldWidth;
            s.style.margin = oldMargin;
        });
        
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        
        isFullscreenMode = false;
        fullscreenBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg> 全屏演示';
    }
});

// 监听全屏状态变化（如按 ESC 退出）
document.addEventListener("fullscreenchange", function() {
    if (!document.fullscreenElement && isFullscreenMode) {
        isFullscreenMode = false;
        fullscreenBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg> 全屏演示';
        const slides = document.querySelectorAll("#result .slide");
        slides.forEach(s => {
            s.style.width = oldWidth;
            s.style.margin = oldMargin;
        });
    }
});

// 处理文件输入变化事件
uploadFileInput.addEventListener("change", function(evt) {
	const file = evt.target.files[0];
	if (!file) return;
    handleFile(file);
});

// 核心解析逻辑：接收 ArrayBuffer 数据进行解析并渲染
async function parseAndRender(fileData) {
	// 初始化界面状态
	resultDiv.innerHTML = "";
    toolbar.style.display = "none";
    progressContainer.style.display = "block";
    progressBar.style.width = "0%";
    loadingText.innerText = "正在读取文件...";

	try {
        loadingText.innerText = "正在解析幻灯片...";
		// 直接获取解析结果（异步函数）
		const result = await pptxToHtml(fileData, {
			slideMode: false,
			keyBoardShortCut: false,
			callbacks: {
				onProgress: function(percent) {
					progressBar.style.width = percent + "%";
                    loadingText.innerText = `解析进度: ${percent}%`;
				}
			}
		});

		// 渲染全局CSS
		if (result.styles && result.styles.global) {
			const style = document.createElement("style");
			style.innerHTML = result.styles.global;
			resultDiv.appendChild(style);
		}
		
		// 渲染所有幻灯片（包裹缩放层，支持自适应宽度与手动缩放）
		// 隐藏幻灯片（p:sld show="0"）在预览与播放中均跳过
		const visibleSlides = result.slides.filter(s => !s.hidden);
		visibleSlides.forEach(slide => {
			const slideContainer = document.createElement("div");
            slideContainer.innerHTML = slide.html;
			const slideEl = slideContainer.firstChild;
			const scaler = document.createElement("div");
			scaler.className = "slide-scaler";
			scaler.appendChild(slideEl);
            resultDiv.appendChild(scaler);
		});

		// 记录幻灯片尺寸并自动适应宽度
		currentSlideSize = result.slideSize || null;
		applyScale();
		fitToWidth();

		// 渲染所有图表 - 使用 ChartRenderer 模块
		if (result.charts && result.charts.length > 0) {
			window.chartRenderer.renderCharts(result.charts);
		}

        // 完成后的处理
        progressContainer.style.display = "none";
        toolbar.style.display = "flex";
		
	} catch (err) {
		console.error(err);
        progressContainer.style.display = "none";
		alert("解析失败: " + err.message);
	}
}

async function handleFile(file) {
	// 验证文件类型
	if (file.name.split('.').pop().toLowerCase() !== "pptx") {
		alert("请上传有效的 .pptx 文件");
		return;
	}

	// 使用 FileReader 读取文件
	const reader = new FileReader();
	reader.onload = async function(e) {
		await parseAndRender(e.target.result);
	};
	reader.readAsArrayBuffer(file);
}

// ===== 预览缩放：自动适应宽度 + 手动缩放（与 vue-demo 一致）=====
function applyScale() {
    const scalers = resultDiv.querySelectorAll('.slide-scaler');
    scalers.forEach(scaler => {
        scaler.style.width = (currentSlideSize.width * currentScale) + 'px';
        scaler.style.height = (currentSlideSize.height * currentScale) + 'px';
        const inner = scaler.firstElementChild;
        if (inner) inner.style.transform = 'scale(' + currentScale + ')';
    });
    const label = document.getElementById('zoom-label');
    if (label) label.textContent = Math.round(currentScale * 100) + '%';
}

// 根据预览区宽度自动计算缩放比（限制 0.1~2 倍）
function fitToWidth() {
    if (!currentSlideSize || !currentSlideSize.width) {
        currentScale = 1;
        applyScale();
        return;
    }
    const avail = resultDiv.clientWidth - 48; // 减去左右 padding
    let s = avail / currentSlideSize.width;
    s = Math.max(0.1, Math.min(2, s));
    currentScale = +s.toFixed(3);
    applyScale();
}

function zoomIn() {
    currentScale = Math.min(2, +(currentScale * 1.1).toFixed(3));
    applyScale();
}

function zoomOut() {
    currentScale = Math.max(0.1, +(currentScale / 1.1).toFixed(3));
    applyScale();
}

// 事件绑定：手动缩放、窗口/全屏尺寸变化时自动适应宽度
document.getElementById('zoom-in').addEventListener('click', zoomIn);
document.getElementById('zoom-out').addEventListener('click', zoomOut);
document.getElementById('zoom-label').addEventListener('click', fitToWidth);
window.addEventListener('resize', fitToWidth);
document.addEventListener('fullscreenchange', fitToWidth);

// 默认加载远程示例 PPTX
const DEFAULT_PPTX_URL = "https://pptx.js.org/pages/Sample_demo1.pptx";

async function loadDefaultPptx() {
    try {
        loadingText.innerText = "正在下载示例文件...";
        progressContainer.style.display = "block";
        const resp = await fetch(DEFAULT_PPTX_URL);
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const fileData = await resp.arrayBuffer();
        await parseAndRender(fileData);
    } catch (err) {
        console.error(err);
        progressContainer.style.display = "none";
        alert("默认示例加载失败: " + err.message);
    }
}

loadDefaultPptx();

// 暴露缩放函数给播放逻辑模块使用（模块作用域隔离）
window.applyScale = applyScale;
window.fitToWidth = fitToWidth;
</script>
</script>
<script type="text/javascript">
    // 全屏功能实现
    var oldWidth, oldMargin, isFullscreenMode = false;
    document.getElementById("fullscreen-btn").addEventListener("click", function() {
        if (!isFullscreenMode) {
            // 进入全屏模式
            var slides = document.querySelectorAll("#result .slide");
            if (slides.length > 0) {
                oldWidth = slides[0].style.width;
                oldMargin = slides[0].style.margin;
                for (var i = 0; i < slides.length; i++) {
                    slides[i].style.width = "99%";
                    slides[i].style.margin = "0 auto";
                }
            }
            
            // 兼容不同浏览器的全屏 API
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
                document.documentElement.msRequestFullscreen();
            } else if (document.documentElement.mozRequestFullScreen) {
                document.documentElement.mozRequestFullScreen();
            }
            isFullscreenMode = true;
        } else {
            // 退出全屏模式
            var slides = document.querySelectorAll("#result .slide");
            for (var i = 0; i < slides.length; i++) {
                slides[i].style.width = oldWidth;
                slides[i].style.margin = oldMargin;
            }
            
            // 兼容不同浏览器的退出全屏 API
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            }
            isFullscreenMode = false;
        }
    });

    // 监听全屏状态变化
    document.addEventListener("fullscreenchange", function() {
        if (!document.fullscreenElement) {
            // 退出全屏时恢复原始样式
            var slides = document.querySelectorAll("#result .slide");
            for (var i = 0; i < slides.length; i++) {
                slides[i].style.width = oldWidth;
                slides[i].style.margin = oldMargin;
            }
        }
    });
</script>

<!-- 播放演示覆盖层（动画 / 切换 / 自动播放） -->
<div id="player">
    <div id="player-bar">

        <button class="pp-btn" id="player-next">下一页 ›</button>

        <span class="pp-page" id="player-page"></span>
    </div>
</div>

<script type="module">
const player = document.getElementById('player');
const playerPage = document.getElementById('player-page');
let playerState = null;

function parseAttr(s) {
    if (!s) return null;
    try { return JSON.parse(s); } catch { return null; }
}

function getVisibleSlideEls() {
    return [...document.querySelectorAll('#result .slide-scaler > section.slide')]
        .filter(s => !s.hasAttribute('data-hidden'));
}

function startPlay() {
    const slides = getVisibleSlideEls();
    if (!slides.length) return;
    // 记录原位，便于退出后还原
    const originals = slides.map(s => ({ s, parent: s.parentNode, next: s.nextSibling }));
    const holders = [];
    slides.forEach(s => {
        s.style.transform = '';          // 清除预览缩放
        const holder = document.createElement('div');
        holder.className = 'pptx-holder';
        holder.appendChild(s);
        player.appendChild(holder);
        holders.push(holder);
    });
    playerState = { slides, holders, originals, index: 0, timers: [] };
    player.style.display = 'flex';
    showSlide(0);
}

function showSlide(i) {
    const st = playerState;
    st.timers.forEach(clearTimeout); st.timers = [];
    st.holders.forEach((h, k) => { h.style.display = (k === i) ? '' : 'none'; });

    const cur = st.slides[i];
    const holder = st.holders[i];
    const w = cur.offsetWidth || 1280;
    const h = cur.offsetHeight || 720;
    const scale = Math.min((window.innerWidth * 0.92) / w, (window.innerHeight * 0.9) / h);
    cur.style.transform = 'scale(' + scale + ')';
    cur.style.transformOrigin = 'top left';
    holder.style.width = (w * scale) + 'px';
    holder.style.height = (h * scale) + 'px';

    // 切页过渡（淡入）
    holder.classList.remove('fade-in'); void holder.offsetWidth; holder.classList.add('fade-in');

    runEntrance(cur);

    const timing = parseAttr(cur.getAttribute('data-timing'));
    if (timing && timing.autoplay != null) {
        const maxDur = timing.animations
            ? Math.max.apply(null, timing.animations.map(a => a.duration)) * 1000
            : 0;
        st.timers.push(setTimeout(() => nextSlide(), timing.autoplay + maxDur + 500));
    }
    playerPage.textContent = (i + 1) + ' / ' + st.slides.length;
}

function runEntrance(slideEl) {
    // 清除上一次遗留下的动画状态
    slideEl.querySelectorAll('.pptx-anim').forEach(el => {
        el.classList.remove('pptx-anim', 'pptx-fade', 'pptx-flyIn', 'pptx-zoom', 'pptx-wipe');
        el.style.opacity = ''; el.style.transform = '';
    });
    const timing = parseAttr(slideEl.getAttribute('data-timing'));
    const anims = (timing && timing.animations) || [];
    if (!anims.length) return;
    anims.forEach(a => {
        const el = slideEl.querySelector('[_id="' + a.spid + '"]');
        if (!el) return;
        el.classList.remove('pptx-anim', 'pptx-fade', 'pptx-flyIn', 'pptx-zoom', 'pptx-wipe');
        void el.offsetWidth;
        el.style.setProperty('--dur', (a.duration || 1) + 's');
        el.classList.add('pptx-anim', 'pptx-' + (a.type || 'fade'));
    });
}

function nextSlide() {
    const st = playerState; if (!st) return;
    const ni = st.index + 1;
    if (ni < st.slides.length) { st.index = ni; showSlide(ni); }
    else exitPlay();
}
function prevSlide() {
    const st = playerState; if (!st) return;
    const ni = st.index - 1;
    if (ni >= 0) { st.index = ni; showSlide(ni); }
}
function exitPlay() {
    const st = playerState; if (!st) return;
    st.timers.forEach(clearTimeout);
    st.originals.forEach(o => {
        if (o.next && o.next.parentNode === o.parent) o.parent.insertBefore(o.s, o.next);
        else o.parent.appendChild(o.s);
    });
    player.style.display = 'none';
    player.innerHTML = '';
    playerState = null;
    if (window.applyScale) window.applyScale();   // 还原预览缩放
}

document.getElementById('play-btn').addEventListener('click', startPlay);
document.getElementById('player-next').addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); });
document.getElementById('player-prev').addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); });
document.getElementById('player-exit').addEventListener('click', (e) => { e.stopPropagation(); exitPlay(); });

// 点击画面（非控件）翻页；Esc 退出；方向键 / 空格翻页
player.addEventListener('click', (e) => {
    if (e.target.closest('#player-bar')) return;
    nextSlide();
});
document.addEventListener('keydown', (e) => {
    if (!playerState) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); nextSlide(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    else if (e.key === 'Escape') exitPlay();
});
</script>
